name: Update Bell Centre calendar

on:
  schedule:
    - cron: "0 10 * * *"   # daily, 10:00 UTC = 6:00 AM Montreal (EDT)
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch events
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: python3 fetch_events.py

      - name: Commit results
        run: |
          git config user.name "bell-centre-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ venue_id.txt
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Update events $(date -u +%F)"
          git push
